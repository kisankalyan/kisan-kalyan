<!DOCTYPE html>
<html lang="hi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="description" content="Kisan Kalyan - Farmer Procurement Management System prototype. Book procurement slots, get a digital token, track the live queue, procurement and payment status." />
  <title>Kisan Kalyan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- App shell -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/home" id="brandLink">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="M12 22c-4 0-7-3-7-7 3 0 7 1 7 7Z"/><path d="M12 22c4 0 7-3 7-7-3 0-7 1-7 7Z"/><path d="M12 10c-3 0-5-2-5-5 3 0 5 2 5 5Z"/><path d="M12 10c3 0 5-2 5-5-3 0-5 2-5 5Z"/></svg>
        </span>
        <span class="brand-text">
          <strong>Kisan Kalyan</strong>
          <small data-i18n="tagline">Farmer Procurement System</small>
        </span>
      </a>
      <div class="topbar-actions">
        <button class="pill" id="langToggle" type="button" aria-label="Toggle language">
          <span id="langLabel">EN</span>
        </button>
        <button class="pill icon-pill" id="themeToggle" type="button" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="pill icon-pill notif-pill" id="notifBtn" type="button" aria-label="Notifications" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="notif-dot" id="notifDot" hidden></span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <!-- Farmer bottom navigation -->
  <nav class="bottomnav" id="bottomnav" hidden>
    <a href="#/home" data-nav="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span data-i18n="nav_home">Home</span>
    </a>
    <a href="#/centres" data-nav="centres">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span data-i18n="nav_centres">Centres</span>
    </a>
    <a href="#/token" data-nav="token">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/><path d="M13 6v12" stroke-dasharray="2 2"/></svg>
      <span data-i18n="nav_token">Token</span>
    </a>
    <a href="#/history" data-nav="history">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 2"/></svg>
      <span data-i18n="nav_history">History</span>
    </a>
    <a href="#/help" data-nav="help">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.5 1.5c0 1.5-2 2-2 3.5"/><path d="M12 17h.01"/></svg>
      <span data-i18n="nav_help">Help</span>
    </a>
  </nav>

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
